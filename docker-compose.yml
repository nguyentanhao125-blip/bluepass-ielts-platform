version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 Database (Persistent Volume + Healthcheck)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: bluepass_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bluepass_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-BluePass_Secure_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-bluepass_exam_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bluepass_admin} -d ${POSTGRES_DB:-bluepass_exam_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bluepass_network

  # ---------------------------------------------------------------------------
  # 2. pgAdmin 4 Web GUI for Multi-Member Database Management on VPS
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bluepass_pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@bluepass.edu.vn}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-AdminPg_2026!}
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - bluepass_network

  # ---------------------------------------------------------------------------
  # 3. Next.js 14 Production App Server
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bluepass_nextjs_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-bluepass_admin}:${POSTGRES_PASSWORD:-BluePass_Secure_2026!}@db:5432/${POSTGRES_DB:-bluepass_exam_db}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-bluepass_super_secret_jwt_signing_key_2026_vps}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - bluepass_network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  bluepass_network:
    driver: bridge
